<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="pstack-generalization-title pstack-generalization-desc"><title id="pstack-generalization-title">مقترح: نفس المنطق خارج هندسة البرمجيات</title><desc id="pstack-generalization-desc">يستبدل التصميم المقترح أدوات البرمجة بعقد مجال يحدد المدخلات والمخرج والتحقق والصلاحيات مع إبقاء حلقة التنفيذ والأدلة.</desc><defs><marker id="pstack-generalization-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="pstack-generalization-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="pstack-generalization-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><style>text{fill:#2d3142;font-family:Geist,"Noto Sans Arabic","DejaVu Sans",sans-serif;text-anchor:middle}.name{font-size:24px;font-weight:600}.sub{font-family:"Geist Mono",monospace;font-size:16px;fill:#4f5d75}.label{font-size:18px}.node{fill:#f5f5f5;stroke:#4f5d75;stroke-width:2}.focus{fill:#f9e9e3;stroke:#bf4520}.edge{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#pstack-generalization-arrow)}.return{stroke-dasharray:5 4}</style><rect width="1280" height="900" fill="#f5f5f5"/><text x="640" y="40" class="name" direction="rtl">مقترح: نفس المنطق خارج هندسة البرمجيات</text><path d="M640 144 V200" class="edge "/><path d="M640 272 V328" class="edge "/><path d="M640 400 V456" class="edge "/><path d="M640 528 V572" class="edge "/><path d="M800 620 H904" class="edge "/><rect x="778" y="573" width="148" height="28" fill="#f5f5f5"/><text x="852" y="594" class="label" direction="rtl">نعم</text><path d="M640 668 V732" class="edge "/><rect x="650" y="683" width="148" height="28" fill="#f5f5f5"/><text x="724" y="704" class="label" direction="rtl">لا</text><path d="M480 768 H432 Q424 768 424 760 V372 Q424 364 432 364 H480" class="edge return"/><path d="M384 236 H480" class="edge "/><rect x="480" y="72" width="320" height="72" rx="20" class="node "/><text x="640" y="104" class="name" direction="rtl">هدف قابل للإثبات</text><text x="640" y="129" class="sub">Outcome contract</text><rect x="480" y="200" width="320" height="72" rx="6" class="node focus"/><text x="640" y="232" class="name" direction="rtl">عقد المجال</text><text x="640" y="257" class="sub">inputs · outputs · constraints</text><rect x="480" y="328" width="320" height="72" rx="6" class="node "/><text x="640" y="360" class="name" direction="rtl">وحدات ومسؤوليات وأدوات</text><text x="640" y="385" class="sub">planner → workers</text><rect x="480" y="456" width="320" height="72" rx="6" class="node "/><text x="640" y="488" class="name" direction="rtl">دليل مستقل مرتبط بالنسخة</text><text x="640" y="513" class="sub">artifact ID · evidence</text><path d="M640 572 L800 620 L640 668 L480 620 Z" class="node "/><text x="640" y="616" class="name" direction="rtl">هل اجتاز البوابات؟</text><text x="640" y="641" class="sub">acceptance + authority</text><rect x="904" y="584" width="320" height="72" rx="20" class="node "/><text x="1064" y="616" class="name" direction="rtl">نشر أو تسليم المخرج</text><text x="1064" y="641" class="sub">domain delivery</text><rect x="480" y="732" width="320" height="72" rx="6" class="node "/><text x="640" y="764" class="name" direction="rtl">تصحيح الفرضية أو التصعيد</text><text x="640" y="789" class="sub">retry / human gate</text><rect x="64" y="200" width="320" height="72" rx="6" class="node "/><text x="224" y="232" class="name" direction="rtl">محوّل المجال</text><text x="224" y="257" class="sub">research / design / operations</text><path d="M64 836 H1216" stroke="#bfc0c0"/><text x="640" y="875" class="label" direction="rtl">مقترح معماري غير منفّذ  •  لا يستبدل SHA باسم ملف فقط: يلزم معرّف نسخة ثابت ودليل قابل للفحص</text></svg>