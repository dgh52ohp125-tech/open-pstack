<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="pstack-overview-title pstack-overview-desc"><title id="pstack-overview-title">من الطلب إلى دليل قابل للمراجعة</title><desc id="pstack-overview-desc">المحادثة تختار مسار العمل وتجمع الأدلة وتنفذ وتتحقق قبل تسليم النتيجة ضمن التفويض.</desc><defs><marker id="pstack-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="pstack-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="pstack-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><style>text{fill:#2d3142;font-family:Geist,"Noto Sans Arabic","DejaVu Sans",sans-serif;text-anchor:middle}.name{font-size:24px;font-weight:600}.sub{font-family:"Geist Mono",monospace;font-size:16px;fill:#4f5d75}.label{font-size:18px}.node{fill:#f5f5f5;stroke:#4f5d75;stroke-width:2}.focus{fill:#f9e9e3;stroke:#bf4520}.edge{fill:none;stroke:#4f5d75;stroke-width:2;marker-end:url(#pstack-overview-arrow)}.return{stroke-dasharray:5 4}</style><rect width="1280" height="900" fill="#f5f5f5"/><text x="640" y="40" class="name" direction="rtl">من الطلب إلى دليل قابل للمراجعة</text><path d="M640 144 V200" class="edge "/><path d="M640 272 V328" class="edge "/><path d="M640 400 V456" class="edge "/><path d="M640 528 V584" class="edge "/><path d="M640 656 V712" class="edge "/><path d="M480 364 H384" class="edge "/><path d="M224 400 V484 Q224 492 232 492 H480" class="edge return"/><path d="M800 492 H904" class="edge "/><rect x="480" y="72" width="320" height="72" rx="20" class="node "/><text x="640" y="104" class="name" direction="rtl">الطلب وحدود التفويض</text><text x="640" y="129" class="sub">Goal · constraints</text><rect x="480" y="200" width="320" height="72" rx="6" class="no